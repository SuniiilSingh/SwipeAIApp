<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Centered in Adaptive Safe Zone -->
  <g id="blunderr-mark-fg" transform="translate(512, 512)">
    <!-- Letter B (Cream White #FAF7F2) -->
    <text x="-5" y="125" text-anchor="end"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Arial Black', Arial, sans-serif"
          font-weight="900" font-size="380" letter-spacing="-0.04em" fill="#FAF7F2">B</text>

    <!-- Flipped Letter R (Electric Coral #FF385C) -->
    <g transform="translate(5, 0) scale(-1, 1)" filter="url(#neon-glow)">
      <text x="0" y="125" text-anchor="end"
            font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Arial Black', Arial, sans-serif"
            font-weight="900" font-size="380" letter-spacing="-0.04em" fill="#FF385C">R</text>
    </g>
  </g>
</svg>
