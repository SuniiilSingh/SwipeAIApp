<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="coral-glow" cx="54%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF385C" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FF385C" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#08080C" stop-opacity="0" />
    </radialGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1024" height="1024" fill="#08080C" />
  <rect width="1024" height="1024" fill="url(#coral-glow)" />

  <!-- Monogram Mark: Cream B + Flipped Coral R -->
  <g id="blunderr-mark" transform="translate(512, 512)">
    <!-- Letter B (Cream White #FAF7F2) -->
    <text x="-6" y="145" text-anchor="end"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Arial Black', Arial, sans-serif"
          font-weight="900" font-size="440" letter-spacing="-0.04em" fill="#FAF7F2">B</text>

    <!-- Flipped Letter R (Electric Coral #FF385C) -->
    <!-- Flipped horizontally around the seam -->
    <g transform="translate(6, 0) scale(-1, 1)" filter="url(#neon-glow)">
      <text x="0" y="145" text-anchor="end"
            font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Arial Black', Arial, sans-serif"
            font-weight="900" font-size="440" letter-spacing="-0.04em" fill="#FF385C">R</text>
    </g>
  </g>
</svg>
